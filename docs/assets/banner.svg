<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Endstone Sign API</title>
  <desc id="description">A full-control, revision-safe sign service for Endstone Bedrock servers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141a"/>
      <stop offset="0.52" stop-color="#102b39"/>
      <stop offset="1" stop-color="#1c1738"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52e5d1"/>
      <stop offset="0.5" stop-color="#63b8ff"/>
      <stop offset="1" stop-color="#f2b84b"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203b49"/>
      <stop offset="1" stop-color="#17243d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52e5d1" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#52e5d1"/>
      <stop offset="0.75" stop-color="#f2b84b"/>
      <stop offset="1" stop-color="#f2b84b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9cdceb" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#background)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <circle cx="1120" cy="-20" r="220" fill="#63b8ff" opacity="0.07"/>
  <circle cx="60" cy="360" r="190" fill="#52e5d1" opacity="0.07"/>

  <g transform="translate(70 45)">
    <path d="M26 8h178l24 24v184l-24 24H26L2 216V32Z" fill="#0b1b25" stroke="url(#accent)" stroke-width="3"/>
    <path d="M75 22v42M155 22v42" stroke="#79d9e7" stroke-width="7" stroke-linecap="round"/>
    <circle cx="75" cy="22" r="8" fill="#102b39" stroke="#52e5d1" stroke-width="3"/>
    <circle cx="155" cy="22" r="8" fill="#102b39" stroke="#63b8ff" stroke-width="3"/>
    <rect x="31" y="58" width="168" height="119" rx="12" fill="url(#board)" stroke="url(#accent)" stroke-width="3"/>
    <path d="M59 87h112M59 112h112M59 137h76" stroke="#d8f7f5" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <path d="M115 177v41" stroke="#f2b84b" stroke-width="13" stroke-linecap="round"/>
    <g fill="#52e5d1" filter="url(#glow)">
      <circle cx="15" cy="103" r="4"/><circle cx="215" cy="103" r="4"/>
      <circle cx="115" cy="228" r="4"/>
    </g>
    <path d="M15 103h16M199 103h16M115 218v10" stroke="#65cde8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="350" y="107" fill="#9fc8d4" font-size="19" font-weight="650" letter-spacing="4">ENDSTONE • SERVICE ABI V2</text>
    <text x="346" y="168" fill="#f5fbff" font-size="52" font-weight="760" letter-spacing="-1.5">Sign API</text>
    <text x="350" y="210" fill="#c0d4df" font-size="21">Revision-safe, two-sided sign control for Bedrock server plugins.</text>

    <g transform="translate(350 247)" font-size="15" font-weight="650">
      <rect width="142" height="36" rx="18" fill="#52e5d1" fill-opacity="0.11" stroke="#52e5d1" stroke-opacity="0.44"/>
      <text x="71" y="23" text-anchor="middle" fill="#82efe0">48 variants</text>
      <rect x="156" width="172" height="36" rx="18" fill="#63b8ff" fill-opacity="0.11" stroke="#63b8ff" stroke-opacity="0.44"/>
      <text x="242" y="23" text-anchor="middle" fill="#9bd0ff">two-sided text</text>
      <rect x="342" width="154" height="36" rx="18" fill="#f2b84b" fill-opacity="0.1" stroke="#f2b84b" stroke-opacity="0.42"/>
      <text x="419" y="23" text-anchor="middle" fill="#ffd27a">atomic edits</text>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="337" rx="22.5" fill="none" stroke="url(#rule)" stroke-width="3" opacity="0.72"/>
</svg>
