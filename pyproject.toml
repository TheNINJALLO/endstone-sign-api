[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-sign-api"
version = "0.2.0a1"
description = "Complete sign lifecycle contract and exact-build activation framework for Endstone"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Ninj-OS contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
