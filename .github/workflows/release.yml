name: Release Sign API

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify metadata and symbol gate
        run: |
          python scripts/verify_project_metadata.py
          python tools/verify_fail_closed.py
      - name: Configure
        run: cmake -S . -B build -DENDSTONE_SIGN_BUILD_TESTS=ON -DENDSTONE_SIGN_BUILD_SHARED=ON -DENDSTONE_SIGN_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install SDK
        run: cmake --install build --config Release --prefix stage
      - name: Package SDK
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath endstone-sign-api-${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: endstone-sign-api-${{ matrix.artifact }}
          path: endstone-sign-api-${{ matrix.artifact }}.zip

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m unittest discover -s tests/python -v
        env:
          PYTHONPATH: python
      - run: python -m build --wheel
      - name: Test installed wheel
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python -m unittest discover -s tests/python -v
      - uses: actions/upload-artifact@v6
        with:
          name: python-wheel
          path: dist/*.whl

  publish:
    needs: [native, wheel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "*"
          merge-multiple: true
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --prerelease
