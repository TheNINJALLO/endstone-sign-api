name: Build Sign API

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.2.1-alpha.3
  PROJECT_SLUG: endstone-sign-api

jobs:
  metadata:
    name: Verify release and native-gate metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify synchronized project metadata
        run: |
          python scripts/verify_project_metadata.py
          python scripts/verify_bds_sign_identifiers.py --platform linux-x64
          python tools/verify_native_symbol_candidates.py
          python tools/verify_fail_closed.py
      - name: Verify the Linux native manifest remains unverified
        shell: bash
        run: |
          set -euxo pipefail
          manifest="native/manifests/linux-x64-1.26.33.1.json"
          python tools/verify_native_manifest.py "$manifest" --allow-incomplete
          if python tools/verify_native_manifest.py "$manifest"; then
            echo "$manifest unexpectedly passed the verified-release gate" >&2
            exit 1
          fi

  portable:
    name: Portable tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2022
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install portable Python package
        run: python -m pip install -e .
      - name: Compile and test Python package
        run: |
          python -m compileall -q python
          python -m unittest discover -s tests/python -v
      - name: Build portable wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Configure portable C++ build
        run: >-
          cmake -S . -B build
          -DENDSTONE_SIGN_BUILD_TESTS=ON
          -DENDSTONE_SIGN_BUILD_SHARED=ON
          -DENDSTONE_SIGN_BUILD_PLUGIN=OFF
      - name: Build and test portable C++ targets
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

  exact-release:
    name: BDS 1.26.33 supported Linux release (${{ matrix.platform }})
    needs: [metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bds: "1.26.33"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install exact-build dependencies
        run: >-
          python -m pip install
          "conan==2.31.1"
          "build==1.4.0"
          "setuptools==80.9.0"
          "wheel==0.46.3"
          "endstone==0.11.6"

      - name: Install Linux compiler toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          if ! command -v clang-18 >/dev/null 2>&1; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 18
          fi
          sudo apt-get install -y ninja-build clang-tools-18 lld-18 libc++-18-dev libc++abi-18-dev
          sudo update-alternatives --install /usr/bin/clang-scan-deps clang-scan-deps /usr/bin/clang-scan-deps-18 100 || true
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          clang-18 --version
          clang++-18 --version
          ninja --version

      - name: Build and package Linux release
        shell: bash
        run: >-
          python scripts/build_exact.py
          --bds "${{ matrix.bds }}"
          --platform "${{ matrix.platform }}"
          --parallel 2

      - name: Publish exact-build failure summary
        if: failure()
        shell: pwsh
        run: |
          $log = Get-ChildItem dist/diagnostics -Filter exact-build.log -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $log) {
            Write-Host "::error title=Exact native build failed::No exact-build.log was produced."
            exit 0
          }
          $diagnostics = @(Get-Content $log.FullName | Where-Object {
            $_ -match '(?i)(fatal error:|\berror:|\berror C[0-9]+:|undefined (reference|symbol)|\bld(?:\.lld)?(?:-[0-9]+)?:)'
          } | Select-Object -Last 20)
          if ($diagnostics.Count -eq 0) {
            Write-Host "::error title=Exact native build failed::The build failed without a compiler diagnostic line."
            exit 0
          }
          $message = $diagnostics -join "`n"
          if ($env:GITHUB_WORKSPACE) {
            $message = $message.Replace($env:GITHUB_WORKSPACE, '<workspace>')
          }
          $message = $message -replace 'https?://\S+', '<url>'
          $message = $message -replace '(?i)(token|password|secret)=[^\s]+', '$1=<redacted>'
          $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::error title=Exact native build failed::$message"

      - name: Verify platform release assets
        run: >-
          python scripts/verify_release_assets.py
          --slug "${{ env.PROJECT_SLUG }}"
          --version "${{ env.RELEASE_VERSION }}"
          --bds "${{ matrix.bds }}"
          --platform "${{ matrix.platform }}"
          --release-dir dist/release

      - name: Smoke-test Linux test-command wheel
        shell: bash
        run: |
          wheels=(dist/release/*-cp314-cp314-linux_x86_64.whl)
          test "${#wheels[@]}" -eq 1
          python tests/python/verify_test_wheel.py "${wheels[0]}"

      - name: Upload disposable-server test package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_SLUG }}-release-${{ matrix.bds }}-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_SLUG }}-diagnostics-${{ matrix.bds }}-${{ matrix.platform }}
          path: |
            build-exact/**/CMakeCache.txt
            build-exact/**/CMakeFiles/CMakeOutput.log
            build-exact/**/CMakeFiles/CMakeError.log
            build-exact/**/*.log
            dist/**/*.json
            dist/diagnostics/**/*.log
            .conan2-ci/**/profiles/*
            build-exact/**/conan/**/*.log
          if-no-files-found: warn
          retention-days: 14

  test-wheel:
    name: Verify the Linux Sign API server-test wheel
    needs: [metadata, exact-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install runtime and local test dependencies
        run: |
          python -m pip install "endstone==0.11.6"
          python -m pip install -e .
      - name: Download the Linux package
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.PROJECT_SLUG }}-release-*
          path: dist/test-wheel
          merge-multiple: true
      - name: Verify wheel structure and bundled native bridges
        shell: bash
        run: |
          mapfile -t wheels < <(find dist/test-wheel -maxdepth 1 -type f -name '*.whl' | sort)
          test "${#wheels[@]}" -eq 1
          for wheel in "${wheels[@]}"; do
            python tests/python/verify_test_wheel.py "$wheel" --structure-only
          done
      - name: Run Python command-handler tests
        run: python -m unittest discover -s tests/python -v
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_SLUG }}-test-wheels
          path: dist/test-wheel/*.whl
          if-no-files-found: error
          retention-days: 30
