name: Publish Sign API Linux Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sign-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.2.0
  PROJECT_SLUG: endstone-sign-api

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Run portable Python and C++ test suites
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -e .
          python -m compileall -q python examples/python/sign_api_tester_plugin/src
          python -m unittest discover -s tests/python -p 'test_*.py' -v
          cmake -S . -B build-release-validate \
            -DENDSTONE_SIGN_BUILD_TESTS=ON \
            -DENDSTONE_SIGN_BUILD_SHARED=ON \
            -DENDSTONE_SIGN_BUILD_PLUGIN=OFF
          cmake --build build-release-validate --config Release --parallel 2
          ctest --test-dir build-release-validate -C Release --output-on-failure
      - name: Verify project metadata and release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/verify_project_metadata.py
          python scripts/verify_bds_sign_identifiers.py --platform linux-x64
          # Existing prerelease tags predate the separate candidate ledger.
          if [[ -f tools/verify_native_symbol_candidates.py ]]; then
            python tools/verify_native_symbol_candidates.py
          fi
          python tools/verify_fail_closed.py
          python - <<'PYTAG'
          import json
          import os

          version = json.load(open("SOURCE_RELEASE.json", encoding="utf-8"))["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag must be {expected}, got {actual}")
          PYTAG
          git fetch origin --no-tags +refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin --force \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [[ "$tag_commit" != "$release_commit" ]]; then
              echo "Existing release tag points to $tag_commit, not checked-out $release_commit" >&2
              exit 1
            fi
          fi
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          fi

  exact-release:
    name: Build supported release (${{ matrix.platform }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bds: "1.26.33"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install exact-build dependencies
        run: >-
          python -m pip install
          "conan==2.31.1"
          "build==1.4.0"
          "setuptools==80.9.0"
          "wheel==0.46.3"
          "endstone==0.11.6"

      - name: Install Linux compiler toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          if ! command -v clang-18 >/dev/null 2>&1; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 18
          fi
          sudo apt-get install -y ninja-build clang-tools-18 lld-18 libc++-18-dev libc++abi-18-dev
          sudo update-alternatives --install /usr/bin/clang-scan-deps clang-scan-deps /usr/bin/clang-scan-deps-18 100 || true
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Build Linux release and test wheel
        shell: bash
        run: >-
          python scripts/build_exact.py
          --bds "${{ matrix.bds }}"
          --platform "${{ matrix.platform }}"
          --parallel 2

      - name: Publish exact-build failure summary
        if: failure()
        shell: pwsh
        run: |
          $log = Get-ChildItem dist/diagnostics -Filter exact-build.log -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $log) {
            Write-Host "::error title=Exact native build failed::No exact-build.log was produced."
            exit 0
          }
          $diagnostics = @(Get-Content $log.FullName | Where-Object {
            $_ -match '(?i)(fatal error:|\berror:|\berror C[0-9]+:|undefined (reference|symbol)|\bld(?:\.lld)?(?:-[0-9]+)?:)'
          } | Select-Object -Last 20)
          if ($diagnostics.Count -eq 0) {
            Write-Host "::error title=Exact native build failed::The build failed without a compiler diagnostic line."
            exit 0
          }
          $message = $diagnostics -join "`n"
          if ($env:GITHUB_WORKSPACE) {
            $message = $message.Replace($env:GITHUB_WORKSPACE, '<workspace>')
          }
          $message = $message -replace 'https?://\S+', '<url>'
          $message = $message -replace '(?i)(token|password|secret)=[^\s]+', '$1=<redacted>'
          $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::error title=Exact native build failed::$message"

      - name: Verify exact platform asset set
        run: >-
          python scripts/verify_release_assets.py
          --slug "${{ env.PROJECT_SLUG }}"
          --version "${{ env.RELEASE_VERSION }}"
          --bds "${{ matrix.bds }}"
          --platform "${{ matrix.platform }}"
          --release-dir dist/release

      - name: Smoke-test Linux command wheel
        shell: bash
        run: |
          wheels=(dist/release/*-cp314-cp314-linux_x86_64.whl)
          test "${#wheels[@]}" -eq 1
          python tests/python/verify_test_wheel.py "${wheels[0]}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_SLUG }}-release-${{ matrix.bds }}-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_SLUG }}-release-diagnostics-${{ matrix.platform }}
          path: |
            build-exact/**/CMakeCache.txt
            build-exact/**/*.log
            dist/diagnostics/**/*.log
            .conan2-ci/**/profiles/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [exact-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Download the exact Linux package
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.PROJECT_SLUG }}-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete four-file Linux package set
        run: >-
          python scripts/verify_combined_release_assets.py
          --slug "${{ env.PROJECT_SLUG }}"
          --version "${{ env.RELEASE_VERSION }}"
          --bds "1.26.33"
          --release-dir release-assets
      - name: Generate combined checksums
        working-directory: release-assets
        shell: bash
        run: |
          find . -maxdepth 1 -type f \( -name '*.so' -o -name '*.zip' -o -name '*.whl' -o -name '*.sha256' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4
      - name: Create or update the stable Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euxo pipefail
          notes='Endstone Sign API v0.2.0 is the first supported Linux x64 release for Endstone 0.11.6 / exact BDS 1.26.33.1. It publishes the endstone:sign:v2 C++ service ABI 2 for sign capture, placement, removal, front/back text, per-line updates, filtered text, owner XUID, outline/formatting flags, API change events, replacement, clone, move, and atomic transactions. Every mutation remains exact-binary, primary-thread, capability, revision, readback, and rollback gated. Known unavailable v0.2.0 capabilities are text objects, color, glow, wax, editor locking/opening, player edit interception, restart-persistence certification, and completeControl(). Consumers must require supportedRelease() and each optional capability they use. This release contains only the Linux x64 .so, Linux SDK package, checksum, and CPython 3.14 diagnostic wheel.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --prerelease=false --latest --notes "$notes"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              tag_args=(--verify-tag)
            else
              tag_args=(--target "$GITHUB_SHA")
            fi
            gh release create "$RELEASE_TAG" release-assets/* \
              "${tag_args[@]}" --latest \
              --title "Endstone Sign API $RELEASE_TAG" \
              --notes "$notes"
          fi
          if [[ "$GITHUB_REF" == "refs/heads/$RELEASE_TAG" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_TAG" || true
          fi
