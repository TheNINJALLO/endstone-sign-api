# Endstone Sign API automated disposable-world matrix.
#
# The default run covers every vanilla wood material and all four sign forms.
# Sign text is deliberately kept inside the exact Linux probe's 22-byte
# flattened-message limit (the three line separators count toward the limit).
# The section-sign formatting codes are tested as raw text round trips; this
# does not claim that a Bedrock client rendered the requested color.

schema = 1
delay_ticks = 2
stop_on_failure = false
cleanup_after_run = false
support_block = "minecraft:stone"
spacing = 3
columns = 8
rotation = 0
facing = 2
chains_attached = false
max_cases = 48
max_radius = 48

materials = [
  "oak",
  "spruce",
  "birch",
  "jungle",
  "acacia",
  "dark_oak",
  "mangrove",
  "cherry",
  "bamboo",
  "crimson",
  "warped",
  "pale_oak",
]

kinds = [
  "standing",
  "wall",
  "ceiling_hanging",
  "wall_hanging",
]

front_lines = ["{material_code}", "{kind_code}", "§aF", ""]
back_lines = ["{material_code}", "{kind_code}", "§cB", ""]
line_edit_index = 2
line_edit_value = "§eE"

# These values are included in every case, but the runner calls their native
# mutation only when the matching capability is true. Closed gates are
# recorded as skipped with mutation_attempted=false.
test_advanced_fields = true
argb = 0xff55ff55
glowing = true
waxed = true
